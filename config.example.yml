# Copy to config.local.yml and edit. config.local.yml is gitignored — it holds
# your own project vocabulary, which is what makes transcription accurate.
#
# This file is also the source of defaults: every key here is applied first, and
# config.local.yml is deep-merged on top, so you only need to list overrides.
# API keys are never read from here — only from the daemon's environment.

paths:
  # Everything the daemon owns lives here: spool/, queue.db, daemon.sock, logs/.
  state_dir: ~/.local/state/voice-loop

speech_to_text:
  # deepgram | openai | mock. `whisper-cpp` and `deepgram_ws` (streaming, with
  # server-side endpointing instead of the local silence cutoff) are accepted
  # names but not implemented — they fail loudly rather than falling back.
  provider: deepgram
  # Per-request ceiling for the transcription call.
  timeout_seconds: 20

  deepgram:
    model: nova-3
    language: multi
    # Both of these matter. With smart_format on, spoken ordinals get rewritten
    # ("primero" -> "1o") and land in the prompt that way. They are not
    # settings the adapter reads — they are always sent as false, and there is
    # a test to keep it that way. Listed here as documentation.
    smart_format: false
    numerals: false

  openai:
    model: gpt-4o-transcribe
    language: es

  # Only used by `provider: mock`, for trying the loop out without an API key.
  mock:
    default: "dale, mandale"

microphone:
  enabled: true
  # avfoundation input. Prefer the device *name* — ":MacBook Pro Microphone" —
  # over an index: avfoundation renumbers, so ":0" silently becomes whatever
  # the Mac decided is first today. With Continuity that can be your iPhone in
  # another room, which records nothing and looks exactly like a broken mic.
  # `ffmpeg -f avfoundation -list_devices true -i ""` lists names and indices.
  # ":0" is left as the default only because it is the one value that exists on
  # every Mac; put the name of yours in config.local.yml.
  device: ":0"
  ffmpeg: ffmpeg
  # The net, not the window: a take ends when you stop talking, and this is
  # only what happens if you never do.
  max_seconds: 60
  # avfoundation takes about a second to hand over the first sample; the "speak
  # now" chime waits for it. Give up if it never arrives.
  open_timeout_seconds: 8
  # Keep the WAVs in <state_dir>/mic instead of deleting them. Debugging only.
  keep_recordings: false
  # What ends a take. The threshold is not a number you have to get right: the
  # room is measured at the start of every take and your voice is whatever
  # sits `margin_db` above it, which is the only thing that survives a
  # different room, a different input gain or new headphones.
  silence:
    enabled: true
    # How long you have to stop talking for the take to be over. This is the
    # one to move if you feel rushed (up) or waited on (down).
    min_seconds: 3
    # How much of the take is the room. Measured before your first word, so
    # keep it comfortably shorter than it takes anyone to start answering.
    calibration_seconds: 0.5
    # How far above the room a voice has to be. Ten dB, against the twenty-odd
    # a voice actually clears a room by, leaves room for a quiet answer and
    # still ignores the chair and the keyboard.
    margin_db: 10
    # Only a fallback: used when the measured floor is not a room at all —
    # digital silence, or a floor nothing could clear. It is also what decides
    # whether a take that ran out of time has anything in it worth
    # transcribing; the log prints the levels on every take that ends that way.
    noise_db: -35
    # Silence reported before this point is you not having started yet.
    min_speech_seconds: 0.6

# Terms the recognizer would otherwise invent. Deepgram sends these as `keyterm`
# params; OpenAI folds them into the transcription prompt. Without them, domain
# words come back mangled. Put YOUR services, tools and verbs here — but see
# `vocabulary` below: most of this list writes itself.
keyterms:
  - staging-api
  - worker-queue
  - integration-suite
  - rate-limiter
  - feature-flag

# The rest of the vocabulary, taken from the words you have actually used.
#
# A hand-kept `keyterms` list is wrong the week after you write it, and it can
# never contain the terms that matter most — whatever you happen to be working
# on this month. Claude already keeps every prompt you have typed; counting the
# words in your own messages produces the real list (`pr`, `test`, `issue`,
# `draft`, `stage`, `mergeado`, `lambda`…). Recomputed in the background, and
# merged with `keyterms` above and the names of the windows open right now.
vocabulary:
  enabled: true
  transcripts: ~/.claude/projects/*/*.jsonl
  refresh_hours: 6
  # Deepgram rejects an over-long query string, and the tail of a frequency
  # list is the least useful part of it.
  limit: 80
  # Said fewer times than this, it is a typo, not a term.
  min_count: 3

summaries:
  provider: openai
  model: gpt-4o-mini
  max_words: 12
  # The same request also proposes a name for a window Claude left called
  # `darwin-21` ("¿la llamo tests event processor?"). One call, two fields —
  # with provider: none you lose the offer and keep the announcement.
  # Hard ceiling per attempt (one retry). On timeout or missing key the
  # announcement falls back to a fixed phrase — the queue never waits on the LLM.
  timeout_seconds: 5

# The other half of understanding you: the phrase lists in `intents.py` are
# exact and instant and resolve almost everything, and whatever they have never
# heard of goes to `gpt-4o-mini` — which may also answer "that is not a command
# at all", the answer that keeps dictation from becoming a random command. On a
# short leash: one attempt, and every failure degrades to the lexicon alone.
understanding:
  # openai | none. With `none` the lexicon is all there is, which is exactly
  # how the loop behaved before this existed.
  provider: openai
  model: gpt-4o-mini
  # Aggressive on purpose: this sits between you finishing a sentence and
  # anything happening, so a slow answer is worse than no answer.
  timeout_seconds: 2
  # Past this many words it is dictation, not a command, and asking costs a
  # second of silence on every long sentence.
  max_words: 40

windows:
  # What "abrí una ventana nueva" starts in the new tab — normally whatever
  # launches Claude for you (`cd ~/code/thing && claude`). Empty means a plain
  # shell. The tab is always created in the iTerm2 window you already have: a
  # new *window* is somewhere else on the desktop, which is the thing you were
  # trying not to go looking for. Anything you asked for in the same breath
  # ("…y hacé el rebase") is typed in after it.
  new_tab_command: ""

text_to_speech:
  # macOS `say` — offline, zero latency. Use `system` to keep the system voice.
  voice: Paulina
  rate: 190
  # `say` reads English terms with a Spanish accent. Rewrite them phonetically
  # so announcements stay intelligible. Longest match wins, case-insensitive.
  phonetic:
    "pull request": "pul rikuest"
    "merge": "merch"
    "deploy": "diploi"

announce:
  # Blocking events speak and open the mic; milestones only chime.
  milestone_chime: Glass
  blocking_chime: Ping
  # Played when a mic opens with nothing to say first, and — always, and always
  # a different sound — when any mic closes. A mic that shuts in silence is a
  # mic you cannot tell is still open, which is the whole "when do I talk?"
  # problem. When there *is* something to say, the chime of the announcement is
  # the open cue: it now means "I am about to talk, and you can talk to me".
  mic_open_chime: Tink
  mic_close_chime: Pop
  # Played when the busy-mode hotkey flips, in either direction.
  busy_chime: Submarine
  # How long a mic that opened on its own waits for you to start talking.
  mic_timeout_seconds: 8
  # How long a mic that opened *under a sentence* waits, once that sentence
  # ends, for you to start. It is not how long you have to talk: say a word
  # inside it and this stops applying — from there the take ends
  # `microphone.silence.min_seconds` after your last one.
  mic_grace_seconds: 10
  # Claude's own Notification events. Two different things arrive through this
  # one hook and the payload says which: a permission prompt ("Claude needs your
  # permission to use Bash") is a window that cannot move until you answer, and
  # an idle nudge ("Claude is waiting for your input") repeats for as long as
  # you leave a window alone — usually the one you are already sitting in front
  # of. Set to false to drop the idle nudges outright: no voice, no chime, and
  # no entry in the queue. Permission prompts still speak, and so does any
  # wording this does not recognise.
  notification_events: true

# Talking over the assistant while it is talking.
#
# The mic is open the whole time a sentence is being spoken, which only works
# if we can tell your voice from ours. On headphones there is nothing to tell
# apart — the microphone cannot hear `say` at all — so the first syllable you
# speak kills the sentence mid-word. On speakers the microphone hears us, so
# barge-in is off and the echo is subtracted from the transcript instead: we
# know exactly what `say` was given, so recognising it coming back is a string
# comparison. Which of the two is in use is read from the system, not from
# here, because headphones come and go through the day.
barge_in:
  enabled: true
  # How long the detected audio output is trusted before it is looked up again.
  refresh_seconds: 30

delivery:
  auto_enter: true
  # Read the transcript back for confirmation instead of sending it, when the
  # recognizer was unsure or the phrase looks destructive.
  confirm_below_confidence: 0.75
  confirm_if_matches:
    - "\\bdrop\\b"
    - "\\bdelete\\b"
    - "force push"
    - "\\bprod\\b"
  # Takes of the mic per question before the item goes back to pending. Repeat,
  # "mostrame" and a read-back each cost one.
  max_mic_rounds: 3
  plan_menu:
    # A plan menu's rows come from Claude, not from the hook payload, so this
    # one index cannot be derived. Verified on Claude Code 2.1.220: 1 approve
    # with auto mode, 2 approve reviewing each edit, 3 refine elsewhere,
    # 4 "Tell Claude what to change" — the row spoken feedback is typed into.
    feedback_index: 4

integrations:
  # Optional bridge for tooling that already tracks a per-terminal phase in a
  # file (one file per tty, whose contents are the phase name). When a watched
  # file changes to a phase listed under `milestones`, voice-loop plays the
  # milestone chime — no speech. Off by default; nothing else reads these files.
  milestone_file_watch:
    enabled: false
    dir: ~/.local/state/voice-loop/phases
    pattern: "*.phase"
    # phase value -> milestone label (the label is what `pendings` reports)
    milestones:
      pr: PR opened
      ci: CI green
