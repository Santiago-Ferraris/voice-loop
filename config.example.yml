# Copy to config.local.yml and edit. config.local.yml is gitignored — it holds
# your own project vocabulary, which is what makes transcription accurate.
#
# This file is also the source of defaults: every key here is applied first, and
# config.local.yml is deep-merged on top, so you only need to list overrides.
# API keys are never read from here — only from the daemon's environment.

paths:
  # Everything the daemon owns lives here: spool/, queue.db, daemon.sock, logs/.
  state_dir: ~/.local/state/voice-loop

speech_to_text:
  # deepgram | openai | mock. `whisper-cpp` and `deepgram_ws` (streaming, with
  # server-side endpointing instead of the local silence cutoff) are accepted
  # names but not implemented — they fail loudly rather than falling back.
  provider: deepgram
  # Per-request ceiling for the transcription call.
  timeout_seconds: 20

  deepgram:
    model: nova-3
    language: multi
    # Both of these matter. With smart_format on, spoken ordinals get rewritten
    # ("primero" -> "1o") and land in the prompt that way. They are not
    # settings the adapter reads — they are always sent as false, and there is
    # a test to keep it that way. Listed here as documentation.
    smart_format: false
    numerals: false

  openai:
    model: gpt-4o-transcribe
    language: es

  # Only used by `provider: mock`, for trying the loop out without an API key.
  mock:
    default: "dale, mandale"

microphone:
  enabled: true
  # avfoundation input. Prefer the device *name* — ":MacBook Pro Microphone" —
  # over an index: avfoundation renumbers, so ":0" silently becomes whatever
  # the Mac decided is first today. With Continuity that can be your iPhone in
  # another room, which records nothing and looks exactly like a broken mic.
  # `ffmpeg -f avfoundation -list_devices true -i ""` lists names and indices.
  # ":0" is left as the default only because it is the one value that exists on
  # every Mac; put the name of yours in config.local.yml.
  device: ":0"
  ffmpeg: ffmpeg
  # Hard cap on one take. The silence cutoff normally ends it long before.
  max_seconds: 60
  # avfoundation takes about a second to hand over the first sample; the "speak
  # now" chime waits for it. Give up if it never arrives.
  open_timeout_seconds: 8
  # Keep the WAVs in <state_dir>/mic instead of deleting them. Debugging only.
  keep_recordings: false
  silence:
    enabled: true
    # Anything quieter than this counts as silence…
    noise_db: -35
    # …and this much of it, after you have started talking, closes the mic.
    min_seconds: 1.2
    # Silence reported before this point is you not having started yet.
    min_speech_seconds: 0.6

# Terms the recognizer would otherwise invent. Deepgram sends these as `keyterm`
# params; OpenAI folds them into the transcription prompt. Without them, domain
# words come back mangled. Put YOUR services, tools and verbs here.
keyterms:
  - staging-api
  - worker-queue
  - integration-suite
  - rate-limiter
  - feature-flag

summaries:
  provider: openai
  model: gpt-4o-mini
  max_words: 12
  # The same request also proposes a name for a window Claude left called
  # `darwin-21` ("¿la llamo tests event processor?"). One call, two fields —
  # with provider: none you lose the offer and keep the announcement.
  # Hard ceiling per attempt (one retry). On timeout or missing key the
  # announcement falls back to a fixed phrase — the queue never waits on the LLM.
  timeout_seconds: 5

text_to_speech:
  # macOS `say` — offline, zero latency. Use `system` to keep the system voice.
  voice: Paulina
  rate: 190
  # `say` reads English terms with a Spanish accent. Rewrite them phonetically
  # so announcements stay intelligible. Longest match wins, case-insensitive.
  phonetic:
    "pull request": "pul rikuest"
    "merge": "merch"
    "deploy": "diploi"

announce:
  # Blocking events speak and open the mic; milestones only chime.
  milestone_chime: Glass
  blocking_chime: Ping
  # Played when the mic is actually capturing, and again when it closes.
  mic_open_chime: Tink
  mic_close_chime: Pop
  # Played when the busy-mode hotkey flips, in either direction.
  busy_chime: Submarine
  # How long the mic waits for you to start talking when you are answering a
  # window. Say nothing and the item stays pending; the queue moves on.
  mic_timeout_seconds: 8
  # The same, for the mic that opens on the heads-up ("Nuevo evento de X"). It
  # is asking a question with two words for an answer — "dámelo" or "después" —
  # so it is deliberately short: if you have not started by then, you are not
  # there, and the item quietly stays in the queue.
  alert_mic_timeout_seconds: 4
  # Claude's own Notification events. Two different things arrive through this
  # one hook and the payload says which: a permission prompt ("Claude needs your
  # permission to use Bash") is a window that cannot move until you answer, and
  # an idle nudge ("Claude is waiting for your input") repeats for as long as
  # you leave a window alone — usually the one you are already sitting in front
  # of. Set to false to drop the idle nudges outright: no voice, no chime, and
  # no entry in the queue. Permission prompts still speak, and so does any
  # wording this does not recognise.
  notification_events: true

delivery:
  auto_enter: true
  # Read the transcript back for confirmation instead of sending it, when the
  # recognizer was unsure or the phrase looks destructive.
  confirm_below_confidence: 0.75
  confirm_if_matches:
    - "\\bdrop\\b"
    - "\\bdelete\\b"
    - "force push"
    - "\\bprod\\b"
  # Takes of the mic per question before the item goes back to pending. Repeat,
  # "mostrame" and a read-back each cost one.
  max_mic_rounds: 3
  plan_menu:
    # A plan menu's rows come from Claude, not from the hook payload, so this
    # one index cannot be derived. Verified on Claude Code 2.1.220: 1 approve
    # with auto mode, 2 approve reviewing each edit, 3 refine elsewhere,
    # 4 "Tell Claude what to change" — the row spoken feedback is typed into.
    feedback_index: 4

integrations:
  # Optional bridge for tooling that already tracks a per-terminal phase in a
  # file (one file per tty, whose contents are the phase name). When a watched
  # file changes to a phase listed under `milestones`, voice-loop plays the
  # milestone chime — no speech. Off by default; nothing else reads these files.
  milestone_file_watch:
    enabled: false
    dir: ~/.local/state/voice-loop/phases
    pattern: "*.phase"
    # phase value -> milestone label (the label is what `pendings` reports)
    milestones:
      pr: PR opened
      ci: CI green
