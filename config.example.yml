# Copy to config.local.yml and edit. config.local.yml is gitignored — it holds
# your own project vocabulary, which is what makes transcription accurate.
#
# This file is also the source of defaults: every key here is applied first, and
# config.local.yml is deep-merged on top, so you only need to list overrides.
# API keys are never read from here — only from the daemon's environment.

paths:
  # Everything the daemon owns lives here: spool/, queue.db, daemon.sock, logs/.
  state_dir: ~/.local/state/voice-loop

speech_to_text:
  # deepgram | openai | whisper-cpp
  provider: deepgram

  deepgram:
    model: nova-3
    language: multi
    # Both of these matter. With smart_format on, spoken ordinals get rewritten
    # ("primero" -> "1o") and land in the prompt that way.
    smart_format: false
    numerals: false

  openai:
    model: gpt-4o-transcribe

# Terms the recognizer would otherwise invent. Deepgram sends these as `keyterm`
# params; OpenAI folds them into the transcription prompt. Without them, domain
# words come back mangled. Put YOUR services, tools and verbs here.
keyterms:
  - staging-api
  - worker-queue
  - integration-suite
  - rate-limiter
  - feature-flag

summaries:
  provider: openai
  model: gpt-4o-mini
  max_words: 12
  # Hard ceiling per attempt (one retry). On timeout or missing key the
  # announcement falls back to a fixed phrase — the queue never waits on the LLM.
  timeout_seconds: 5

text_to_speech:
  # macOS `say` — offline, zero latency. Use `system` to keep the system voice.
  voice: Paulina
  rate: 190
  # `say` reads English terms with a Spanish accent. Rewrite them phonetically
  # so announcements stay intelligible. Longest match wins, case-insensitive.
  phonetic:
    "pull request": "pul rikuest"
    "merge": "merch"
    "deploy": "diploi"

announce:
  # Blocking events speak and open the mic; milestones only chime.
  milestone_chime: Glass
  blocking_chime: Ping
  mic_timeout_seconds: 8
  # Claude's own Notification events (permission prompts, idle nudges). These
  # are blocking too, so they speak. Set to false for chime-only.
  notification_events: true

delivery:
  auto_enter: true
  # Read the transcript back for confirmation instead of sending it, when the
  # recognizer was unsure or the phrase looks destructive.
  confirm_below_confidence: 0.75
  confirm_if_matches:
    - "\\bdrop\\b"
    - "\\bdelete\\b"
    - "force push"
    - "\\bprod\\b"

integrations:
  # Optional bridge for tooling that already tracks a per-terminal phase in a
  # file (one file per tty, whose contents are the phase name). When a watched
  # file changes to a phase listed under `milestones`, voice-loop plays the
  # milestone chime — no speech. Off by default; nothing else reads these files.
  milestone_file_watch:
    enabled: false
    dir: ~/.local/state/voice-loop/phases
    pattern: "*.phase"
    # phase value -> milestone label (the label is what `pendings` reports)
    milestones:
      pr: PR opened
      ci: CI green
