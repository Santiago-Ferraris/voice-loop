name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The suite mocks `say`/`afplay`/osascript and all HTTP, so it does not need macOS.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: pyflakes voiceloop tests hooks/merge-hooks.py hooks/vl-spool.py

      - name: Test
        run: pytest -q

      - name: Shell syntax check
        run: |
          for f in hooks/vl-hook.sh bin/voice-loopd bin/voice-loopctl install.sh uninstall.sh; do
            sh -n "$f"
          done
